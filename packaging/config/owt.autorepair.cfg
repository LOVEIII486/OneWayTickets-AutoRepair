## Settings file was created by plugin OWT Auto Repair v0.3.0
## Plugin GUID: owt.autorepair

[1. General]

## 总开关。关闭后不执行任何自动维修。
# Setting type: Boolean
# Default value: true
Enabled = true

## Hybrid：有工具时用真实工具演出，没有工具时回退到后台处理。ToolsOnly：只用真实工具，没有工具就不处理。Background：旧版后台处理，不演出。
# Setting type: String
# Default value: Hybrid
Mode = Hybrid

## 后台模式每次处理水渍/酸液/藤蔓/故障的间隔（秒）。0.25 相当于每秒处理 4 次。
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0.05 to 2
ServiceIntervalSeconds = 0.1

## 安全区里也自动处理。默认关闭，安全区本身会清除异常状态。
# Setting type: Boolean
# Default value: false
WorkInSafeArea = false

## 为 true 时禁止后台回退，只使用工具箱里已有的真实工具；没有工具就不处理。
# Setting type: Boolean
# Default value: false
RequireTools = false

## 在日志里记录选中的工具、开始/结束的动作和回退处理。
# Setting type: Boolean
# Default value: false
LogRepairs = false

[1. Tool animation]

## 自动从工具箱取工具前的停顿（秒），让取工具动作看起来更自然。
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0 to 2
ToolPickupDelaySeconds = 0.05

## 剪刀、抹布、锤子这类点击工具的点击间隔（秒）。工具自身的冷却仍会生效。
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0.05 to 2
ClickIntervalSeconds = 0.1

## 单个自动动作的最长时间（秒）。超时会放下工具，重新找下一个问题。
# Setting type: Single
# Default value: 20
# Acceptable value range: From 1 to 120
ActionTimeoutSeconds = 20

## 问题解决后保持工具动作的收尾时间（秒），让玩家看到完成反馈。
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0 to 3
ReleaseDelaySeconds = 0.05

## 两个自动动作之间的间隔（秒）。
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0 to 5
ToolCooldownSeconds = 0.05

## 自动维修期间临时把当前扳手设为 auto_rotate=true，走游戏内自动扳手的同一条代码路径；结束后还原。
# Setting type: Boolean
# Default value: true
ForceAutoRotate = true

[2. Repair]

## 自动修好已经损毁的装置。
# Setting type: Boolean
# Default value: true
RepairBrokenDevices = true

## 自动修好一台损毁装置所需时间（秒）。原版扳手需要累计 1500 点维修进度。
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0.5 to 60
RepairSeconds = 5

## 自动回复未损毁装置的 HP。原版工具箱没有这个功能，默认关闭。
# Setting type: Boolean
# Default value: false
RepairDamagedDevices = false

## 未损毁装置每秒回复的最大 HP 比例。0.02 表示每秒 2%。
# Setting type: Single
# Default value: 0.02
# Acceptable value range: From 0 to 1
DamagedHpPercentPerSecond = 0.02

[3. Device states]

## 自动灭火。
# Setting type: Boolean
# Default value: true
ExtinguishFire = true

## 每秒降低的火势。原版灭火器约为每秒 30。
# Setting type: Single
# Default value: 30
# Acceptable value range: From 0 to 500
FireExtinguishPerSecond = 30

## 自动擦干装置上的水滴。
# Setting type: Boolean
# Default value: true
DryWetDevices = true

## 自动擦掉装置上的酸液。
# Setting type: Boolean
# Default value: true
CleanAcidDevices = true

## 自动剪断缠绕装置的藤蔓。每剪一次会伤害附着物，和原版剪刀/锯子一致。
# Setting type: Boolean
# Default value: true
CutVines = true

## 自动处理装置故障（stupor）。
# Setting type: Boolean
# Default value: true
FixStupor = true

## 故障时改用“踹一脚”。成功率高，但会伤害装置。关闭时使用无伤害的修复判定。
# Setting type: Boolean
# Default value: false
KickStupor = false

[4. Characters]

## 自动唤醒昏迷的角色。原版需要用闹钟/扩音器等工具。
# Setting type: Boolean
# Default value: true
WakeComatoseCharacters = true

## 每次唤醒减少的昏迷时间。原版 hammer_lv_1_effect 默认为 3000。
# Setting type: Int32
# Default value: 3000
# Acceptable value range: From 1 to 100000
WakePowerPerAttempt = 3000

